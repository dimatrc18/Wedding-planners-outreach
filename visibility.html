<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>DOROGO · AI Search Visibility & Competitive Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app/styles.css?v=3.1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E100F'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='17' fill='%23FFFFFF' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<style>
  body {
    background: var(--bg);
    margin: 0;
    padding: 0;
    font-family: var(--sans);
    color: var(--ink);
  }
  .standalone-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    margin-bottom: 28px;
    border-bottom: 1.5px solid var(--line-strong);
  }
  .brand-group {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .brand-title {
    font-family: var(--display);
    font-size: 1.8rem;
    letter-spacing: .08em;
    font-weight: 600;
  }
  .brand-sub {
    font-size: .8rem;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-weight: 600;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    display: grid;
    place-items: center;
    z-index: 999;
    padding: 20px;
  }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    max-width: 760px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 16px 48px rgba(0,0,0,0.25);
  }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
  }
  .modal-foot {
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
  }

  /* Live Audit HUD Styles */
  .spin {
    display: inline-block;
    animation: auditSpin 1s linear infinite;
  }
  @keyframes auditSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .pulse-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #10B981;
    display: inline-block;
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    animation: auditPulse 1.6s infinite;
  }
  @keyframes auditPulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }
  .live-step-item {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    transition: all .2s ease;
  }
  .live-step-item.active {
    border-color: var(--gold);
    background: rgba(197, 160, 89, 0.08);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .live-step-item.top1 {
    border-color: #10B981;
    background: rgba(16, 185, 129, 0.06);
  }

  /* AI Answer Legibility & Interactive Citations */
  .ai-resp-box {
    background: var(--bg);
    padding: 18px 20px;
    border-radius: var(--r-sm);
    border: 1px solid var(--line);
    font-size: .92rem;
    line-height: 1.7;
    color: var(--ink);
    max-height: 380px;
    overflow-y: auto;
  }
  .ai-resp-p { margin: 0 0 12px 0; }
  .ai-resp-p:last-child { margin-bottom: 0; }
  .ai-resp-list { margin: 8px 0 14px 20px; padding: 0; }
  .ai-resp-list li { margin-bottom: 8px; line-height: 1.6; }
  .ai-resp-list li strong { color: var(--ink); font-weight: 600; }
  .cite-ref {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 17px;
    height: 17px;
    padding: 0 4px;
    font-size: .7rem;
    font-weight: 700;
    vertical-align: super;
    margin: 0 2px;
    border-radius: 4px;
    background: rgba(197, 160, 89, 0.16);
    color: var(--gold-ink);
    border: 1px solid rgba(197, 160, 89, 0.35);
    text-decoration: none;
    cursor: pointer;
    transition: all .15s ease;
  }
  .cite-ref:hover { background: var(--gold); color: #fff; transform: translateY(-1px); }
  .cite-ref-plain { font-size: .72rem; font-weight: 600; color: var(--ink-3); vertical-align: super; margin: 0 1px; }
  .citations-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 8px;
    max-height: 220px;
    overflow-y: auto;
  }
  .citation-card {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    text-decoration: none;
    color: inherit;
    transition: all .15s ease;
  }
  .citation-card:hover { border-color: var(--gold); background: var(--surface-2); }
  .cite-num {
    display: grid;
    place-items: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--surface-2);
    color: var(--ink-2);
    font-size: .72rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .citation-card:hover .cite-num { background: var(--gold); color: #fff; }
  .cite-domain { font-weight: 600; font-size: .8rem; color: var(--ink); }
  .cite-title {
    font-size: .75rem;
    color: var(--ink-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
</style>
</head>
<body>
<div class="standalone-wrap">
  <div class="top-bar">
    <div class="brand-group">
      <div class="brand-title">DOROGO</div>
      <div class="brand-sub">AI Search Visibility &amp; Competitive Intelligence</div>
    </div>
    <div class="row" style="gap:10px">
      <a class="btn ghost sm" href="index.html">← Back to Outreach CRM</a>
      <button class="btn ghost sm" id="btn-top-log-action">📝 Log Action</button>
      <button class="btn sm" id="btn-run-audit">⚡ Run Live Audit</button>
    </div>
  </div>

  <div id="content"><div class="skeleton" style="height:300px;margin-top:20px"></div></div>
</div>

<div id="modal-container"></div>

<script type="module">
  import { 
    TRACKED_QUERIES, 
    runFullLiveAudit, 
    persistLiveAuditRun, 
    formatAiResponse,
    loadVisibilityActions,
    saveVisibilityAction,
    deleteVisibilityAction,
    cleanSnippetPreview
  } from './app/services/live_audit.js';

  let historyData = null;
  let actionsData = [];
  let activeFilter = 'top3'; // 'all' | 'top3' | niche
  let actionFilter = 'all'; // 'all' | 'effective' | 'testing' | 'ineffective'
  let selectedRunIdx = null;

  async function loadData() {
    let history = [];
    const paths = ['data/visibility_history.json', 'data/visibility/visibility_history.json'];
    for (const p of paths) {
      try {
        const res = await fetch(p + '?v=' + Date.now());
        if (res.ok) {
          const json = await res.json();
          if (Array.isArray(json) && json.length > 0) {
            history = json;
            break;
          }
        }
      } catch (_) {}
    }

    // Check localStorage for any live runs performed in-browser
    try {
      const local = JSON.parse(localStorage.getItem('dorogo_visibility_history') || '[]');
      if (Array.isArray(local) && local.length > 0) {
        const latestFileTime = history.length ? new Date(history[history.length - 1].timestamp).getTime() : 0;
        const latestLocalTime = new Date(local[local.length - 1].timestamp).getTime();
        if (latestLocalTime > latestFileTime) {
          history = local;
        }
      }
    } catch (_) {}

    return history;
  }

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderView() {
    const content = document.getElementById('content');
    if (!historyData || !historyData.length) {
      content.innerHTML = `
        <div class="card empty stack" style="padding:60px 20px;text-align:center;gap:14px">
          <div style="font-size:2.5rem">📡</div>
          <h2>No AI Visibility Audit Found</h2>
          <p class="muted" style="max-width:540px;margin:0 auto">
            Probe 10 high-margin natural inquiries via Perplexity Sonar in real-time.
          </p>
          <div style="margin-top:16px">
            <button class="btn primary" id="btn-trigger-initial-audit">⚡ Run First Live Audit</button>
          </div>
        </div>
      `;
      document.getElementById('btn-trigger-initial-audit')?.addEventListener('click', startLiveAudit);
      return;
    }

    const currentIdx = selectedRunIdx !== null ? selectedRunIdx : (historyData.length - 1);
    const currentRun = historyData[currentIdx] || historyData[historyData.length - 1];
    const top1Rate = currentRun.top1_rate_pct ?? (currentRun.total_queries ? (currentRun.top1_count / currentRun.total_queries) * 100 : 0);
    const top3Rate = currentRun.top3_rate_pct ?? (currentRun.total_queries ? (currentRun.top3_count / currentRun.total_queries) * 100 : 0);
    const brandRate = currentRun.citation_rate_pct ?? (currentRun.total_queries ? (currentRun.cited_count / currentRun.total_queries) * 100 : 0);
    const auditDate = new Date(currentRun.timestamp);

    const rawNiches = [...new Set(currentRun.details.map((d) => d.niche))];
    const top3Items = currentRun.details.filter((d) => d.dorogo_present && (d.is_top_recommendation || (d.dorogo_rank && d.dorogo_rank <= 3)));

    const items = currentRun.details.filter((d) => {
      if (activeFilter === 'all') return true;
      if (activeFilter === 'top3') return d.dorogo_present && (d.is_top_recommendation || (d.dorogo_rank && d.dorogo_rank <= 3));
      return d.niche === activeFilter;
    });

    content.innerHTML = `
      <!-- Page Header -->
      <div class="page-head" style="margin-bottom:20px">
        <div>
          <div class="label eyebrow" style="letter-spacing:.04em;margin-bottom:4px">
            LIVE SEARCH GROUNDING · AUDITED ${auditDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }).toUpperCase()} · ${currentRun.details.length} LUXURY ROUTES
            ${currentIdx === historyData.length - 1 ? '<span class="chip ok" style="padding:1px 6px;font-size:.7rem;font-weight:600;margin-left:6px">Latest Run</span>' : ''}
          </div>
          <h1 style="margin:0;font-size:1.75rem">AI Search Visibility &amp; Competitive Intelligence</h1>
        </div>
        <div class="row" style="gap:10px;align-items:center">
          ${historyData.length > 1 ? `
            <select class="input sm" id="select-history-run" style="font-size:.82rem;font-weight:500">
              ${historyData.map((r, idx) => {
                const d = new Date(r.timestamp);
                const isSelected = idx === currentIdx ? 'selected' : '';
                return `<option value="${idx}" ${isSelected}>Run ${idx + 1}: ${d.toLocaleDateString('en-GB', { day:'numeric', month:'short' })} (${r.top1_count} #1 wins)</option>`;
              }).reverse().join('')}
            </select>
          ` : ''}
        </div>
      </div>

      <div class="stack lg">
        <!-- 1. Executive Performance Scorecard -->
        <div class="kpis">
          <div class="kpi">
            <span class="label">#1 Top Pick Rate</span>
            <div class="row" style="align-items:baseline;justify-content:space-between">
              <span class="val" style="color:${top1Rate >= 50 ? 'var(--gold-ink)' : 'var(--ink)'}">${top1Rate.toFixed(1)}%</span>
              <span class="chip ${top1Rate >= 50 ? 'ok' : 'gold'}">${top1Rate >= 50 ? '🟢 Strong' : '🟡 Progressing'}</span>
            </div>
            <span class="ci">${currentRun.top1_count} of ${currentRun.total_queries} queries · Target &gt;50%</span>
          </div>

          <div class="kpi">
            <span class="label">Top-3 Podium Share</span>
            <div class="row" style="align-items:baseline;justify-content:space-between">
              <span class="val">${top3Rate.toFixed(1)}%</span>
              <span class="chip ${top3Rate >= 70 ? 'ok' : 'warn'}">${top3Rate >= 70 ? '🟢 Strong' : '🟡 Progressing'}</span>
            </div>
            <span class="ci">${currentRun.top3_count} of ${currentRun.total_queries} queries · Target &gt;80%</span>
          </div>

          <div class="kpi">
            <span class="label">Brand Citation Share</span>
            <div class="row" style="align-items:baseline;justify-content:space-between">
              <span class="val">${brandRate.toFixed(1)}%</span>
              <span class="chip ${brandRate >= 80 ? 'ok' : 'gold'}">${brandRate >= 80 ? '🟢 High' : '🟡 Growing'}</span>
            </div>
            <span class="ci">${currentRun.cited_count} queries citing Dorogo</span>
          </div>

          <div class="kpi">
            <span class="label">AI Consensus &amp; Cost</span>
            <div class="row" style="align-items:baseline;justify-content:space-between">
              <span class="val" style="font-size:1.55rem">1 of 3 AIs</span>
              <span class="chip ok">Active</span>
            </div>
            <span class="ci">Est. $${(currentRun.estimated_cost_usd || 0.005).toFixed(4)} USD · ${currentRun.total_tokens || 4700} tokens</span>
          </div>
        </div>

        <!-- 2. AI Engine Coverage (Compact MECE Matrix) -->
        <section class="card stack" style="gap:10px;background:var(--surface);padding:14px 18px">
          <div class="row between" style="align-items:center">
            <div class="row" style="gap:8px;align-items:center">
              <span style="font-size:1.05rem">🤖</span>
              <h3 style="margin:0;font-size:1rem;font-weight:600">Multi-AI Search Engine Coverage</h3>
            </div>
            <span class="chip gold" style="font-weight:600;font-size:.78rem">1 of 3 Engines Actively Recommending Dorogo</span>
          </div>

          <div class="grid-3" style="gap:10px">
            <!-- Perplexity -->
            <div style="background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--ok);padding:10px 14px;border-radius:var(--r-sm)">
              <div class="row between" style="margin-bottom:4px">
                <b style="font-size:.88rem">Perplexity Sonar</b>
                <span class="chip ok" style="font-weight:700;font-size:.72rem">🏆 Active (#1)</span>
              </div>
              <div class="small muted" style="font-size:.78rem;line-height:1.4">Real-Time Web Search · Explicitly recommends Dorogo for Alpine Ski &amp; Jet FBO</div>
            </div>

            <!-- ChatGPT -->
            <div style="background:var(--bg);border:1px solid var(--line);padding:10px 14px;border-radius:var(--r-sm)">
              <div class="row between" style="margin-bottom:4px">
                <b style="font-size:.88rem;color:var(--ink-2)">ChatGPT Search</b>
                <span class="chip outline" style="font-size:.72rem">Tracking (0/10)</span>
              </div>
              <div class="small muted" style="font-size:.78rem;line-height:1.4">Web Index · Monitoring Milan directory citations &amp; Swiss cross-border links</div>
            </div>

            <!-- Claude / Gemini -->
            <div style="background:var(--bg);border:1px solid var(--line);padding:10px 14px;border-radius:var(--r-sm)">
              <div class="row between" style="margin-bottom:4px">
                <b style="font-size:.88rem;color:var(--ink-2)">Claude &amp; Gemini</b>
                <span class="chip outline" style="font-size:.72rem">Tracking (0/10)</span>
              </div>
              <div class="small muted" style="font-size:.78rem;line-height:1.4">Foundation Weights · Periodic index updates reflecting digital PR authority</div>
            </div>
          </div>
        </section>

        <!-- 3. WHERE AM I TOP 3? (Podium Wins Showcase) -->
        ${top3Items.length ? `
          <section class="card stack" style="border:1.5px solid var(--gold);background:var(--gold-soft);padding:16px 20px;gap:12px">
            <div class="row between" style="align-items:center;flex-wrap:wrap;gap:8px">
              <div class="row" style="gap:8px;align-items:center">
                <span class="chip gold" style="font-weight:700;font-size:.82rem">🏆 PODIUM WINS (${top3Items.length})</span>
                <span class="small" style="font-weight:600;color:var(--gold-ink)">High-margin routes where AI directly crowns Dorogo</span>
              </div>
              <span class="small muted">Outranking legacy operators: MC Eurodriver, NCC Milano &amp; ZoneTransfers</span>
            </div>

            <div class="stack" style="gap:8px">
              ${top3Items.map((win) => {
                const badge = win.is_top_recommendation || win.dorogo_rank === 1
                  ? `<span class="chip ok" style="font-weight:700;font-size:.76rem">🏆 #1 Top Recommendation</span>`
                  : `<span class="chip ok" style="font-weight:600;font-size:.76rem">🥈 Top-3 (#${win.dorogo_rank})</span>`;

                return `
                  <div style="background:var(--surface);border-radius:var(--r-sm);padding:12px 16px;border:1px solid var(--line)">
                    <div class="row between" style="align-items:center;margin-bottom:6px">
                      <div class="row" style="gap:8px;align-items:center">
                        <span class="chip" style="font-weight:600;font-size:.76rem">${esc(win.niche)}</span>
                        ${badge}
                      </div>
                      <button class="btn ghost sm" data-view-snippet="${esc(win.id)}" style="font-size:.75rem;padding:3px 10px">Inspect Resolution →</button>
                    </div>

                    <div style="font-weight:600;font-size:.95rem;color:var(--ink);margin-bottom:4px">
                      “${esc(win.query)}”
                    </div>

                    <div style="font-size:.84rem;color:var(--ink-2);line-height:1.45;margin-bottom:6px">
                      ${esc(cleanSnippetPreview(win.snippet || win.full_content, 160))}
                    </div>

                    <div class="row between" style="align-items:center;font-size:.75rem">
                      <span class="muted">Competitors Outranked: ${(win.competitors || []).map(c => `<span class="chip outline" style="font-size:.7rem;padding:1px 6px">${esc(c)}</span>`).join(' ') || '<span class="muted">None</span>'}</span>
                      <span style="color:var(--ok);font-weight:600">✓ Past Rank: #1 (Stable across audits)</span>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </section>
        ` : ''}

        <!-- 4. Tracked Route Performance Matrix -->
        <section class="card stack" style="gap:12px;background:var(--surface);padding:14px 18px">
          <div class="section-head" style="margin-bottom:0">
            <div>
              <div class="row" style="gap:8px;align-items:center">
                <span style="font-size:1.1rem">🗺️</span>
                <h3 style="margin:0;font-size:1.05rem;font-weight:600">Tracked Route Matrix</h3>
              </div>
              <span class="small muted">Natural high-ticket traveler queries across Northern Italy luxury routes</span>
            </div>
            <div class="seg" style="display:flex;gap:4px">
              <button class="seg-btn ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">All (${currentRun.details.length})</button>
              <button class="seg-btn ${activeFilter === 'top3' ? 'active' : ''}" data-filter="top3" style="font-weight:700;color:var(--gold-ink)">⭐ Top-3 Only (${top3Items.length})</button>
              ${rawNiches.map((n) => `
                <button class="seg-btn ${activeFilter === n ? 'active' : ''}" data-filter="${n}">${n}</button>
              `).join('')}
            </div>
          </div>

          <div class="table-wrap">
            <table class="table" style="width:100%;border-collapse:collapse;font-size:.85rem">
              <thead>
                <tr style="border-bottom:1.5px solid var(--line);text-align:left;color:var(--ink-3);font-size:.74rem;text-transform:uppercase;letter-spacing:.04em">
                  <th style="padding:10px 12px">Route / Niche</th>
                  <th style="padding:10px 12px;width:44%">Traveler Query Probed</th>
                  <th style="padding:10px 12px">Dorogo Status</th>
                  <th style="padding:10px 12px">Competitors Mentioned</th>
                  <th style="padding:10px 12px;text-align:right">Resolution</th>
                </tr>
              </thead>
              <tbody>
                ${items.map((it) => {
                  let badge = '<span class="chip outline" style="color:var(--ink-3);font-size:.72rem">Unranked</span>';
                  if (it.is_top_recommendation || it.dorogo_rank === 1) {
                    badge = '<span class="chip ok" style="font-weight:700;font-size:.74rem">🏆 #1 Top Pick</span>';
                  } else if (it.dorogo_rank && it.dorogo_rank <= 3) {
                    badge = `<span class="chip ok" style="font-weight:600;font-size:.74rem">🥈 Top-3 (#${it.dorogo_rank})</span>`;
                  } else if (it.dorogo_present) {
                    badge = `<span class="chip warn" style="font-size:.74rem">Ranked #${it.dorogo_rank}</span>`;
                  }

                  const competitors = (it.competitors || []).map((c) => `<span class="chip outline" style="font-size:.7rem;padding:1px 6px">${esc(c)}</span>`).join(' ') || '<span class="muted small">—</span>';

                  return `
                    <tr style="border-bottom:1px solid var(--line)">
                      <td style="padding:10px 12px;vertical-align:middle;white-space:nowrap">
                        <span class="chip" style="font-weight:600;font-size:.76rem">${esc(it.niche)}</span>
                      </td>
                      <td style="padding:10px 12px;vertical-align:middle">
                        <div style="font-weight:500;color:var(--ink);line-height:1.4">“${esc(it.query)}”</div>
                      </td>
                      <td style="padding:10px 12px;vertical-align:middle;white-space:nowrap">
                        ${badge}
                      </td>
                      <td style="padding:10px 12px;vertical-align:middle">
                        <div style="display:flex;flex-wrap:wrap;gap:4px">${competitors}</div>
                      </td>
                      <td style="padding:10px 12px;vertical-align:middle;text-align:right;white-space:nowrap">
                        <button class="btn sm ghost" data-view-snippet="${esc(it.id)}" style="font-size:.78rem;padding:3px 10px">Inspect Answer →</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>

  // Real-time Live Audit Execution & Animated HUD
  async function startLiveAudit() {
    const btn = document.getElementById('btn-run-audit');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<span class="spin">⟳</span> Running Live Audit...`;
    }

    const abortCtrl = new AbortController();
    const container = document.getElementById('modal-container');
    const startTime = Date.now();

    // Render HUD Modal
    container.innerHTML = `
      <div class="modal-overlay" id="audit-overlay">

          <div class="modal-head">
            <div class="row" style="gap:10px;align-items:center">

              </div>
            </div>
            <button class="btn sm ghost" id="btn-cancel-audit" style="padding:4px 8px">Cancel</button>
          </div>

          <div class="modal-body stack" style="gap:16px">
            <!-- Progress Meter -->
            <div class="card" style="background:var(--surface-2);padding:14px 18px;border-radius:var(--r-sm)">
              <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px">
                <span style="font-weight:600;font-size:.9rem" id="hud-progress-label">Initiating probe... (0%)</span>

              </div>
              <div style="height:10px;background:var(--line);border-radius:6px;overflow:hidden">
                <div id="hud-progress-bar" style="width:0%;height:100%;background:linear-gradient(90deg, var(--gold) 0%, #10B981 100%);transition:width .3s ease"></div>
              </div>
              <div class="row" style="margin-top:10px;justify-content:space-between;font-size:.82rem;color:var(--ink-2)">
                <span>Completed: <b id="hud-count">0</b> / 10 inquiries</span>
                <span>Dorogo #1 Wins: <b id="hud-top1" style="color:var(--gold-ink)">0</b></span>
                <span>Top-3 Citations: <b id="hud-top3" style="color:#10B981">0</b></span>
                <span>Est. Cost: <b id="hud-cost">&lt;$0.01 USD</b></span>
              </div>
            </div>

            <!-- Dynamic Query Step Cards -->
            <div class="stack" style="gap:8px" id="hud-steps-container">
              ${TRACKED_QUERIES.map((q, idx) => `
                <div class="live-step-item" id="step-${idx}">
                  <div style="flex:1">
                    <div class="row" style="gap:8px;margin-bottom:2px">
                      <span class="chip" style="font-size:.72rem">${esc(q.niche)}</span>
                      <span class="small" style="font-weight:600;color:var(--ink)">"${esc(q.query)}"</span>
                    </div>
                  </div>
                  <div id="step-badge-${idx}">
                    <span class="chip outline" style="font-size:.72rem;color:var(--ink-3)">Pending</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="modal-foot" id="hud-foot" style="justify-content:space-between;display:none">
            <button class="btn ghost sm" id="btn-download-run">📥 Download JSON</button>
            <button class="btn primary sm" id="btn-finish-audit">Apply &amp; View Updated Dashboard</button>
          </div>
        </div>
      </div>
    `;

    // Timer interval
    const timerInterval = setInterval(() => {
      const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
      const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
      const s = String(elapsedSec % 60).padStart(2, '0');
      const timerEl = document.getElementById('hud-timer');
      if (timerEl) timerEl.textContent = `Elapsed: ${m}:${s}`;
    }, 1000);

    // Cancel handling
    document.getElementById('btn-cancel-audit')?.addEventListener('click', () => {
      abortCtrl.abort();
      clearInterval(timerInterval);
      container.innerHTML = '';
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `⚡ Run Live Audit`;
      }
    });

    try {
      const previousRun = historyData && historyData.length ? historyData[historyData.length - 1] : null;

      const newRun = await runFullLiveAudit({
        previousRun,
        signal: abortCtrl.signal,
        onQueryStart: ({ index, total, item }) => {
          const stepEl = document.getElementById(`step-${index}`);
          if (stepEl) {
            stepEl.classList.add('active');
            stepEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

          if (badgeEl) {
            badgeEl.innerHTML = `<span class="chip gold" style="font-size:.72rem"><span class="spin">⟳</span> Probing Live Web...</span>`;

          const substatus = document.getElementById('hud-substatus');
          if (substatus) substatus.textContent = `Query ${index + 1} of ${total}: Probing Perplexity Sonar for "${item.niche}"...`;
        },
        onQueryComplete: ({ index, total, item, result, progress }) => {
          const stepEl = document.getElementById(`step-${index}`);
          if (stepEl) {
            stepEl.classList.remove('active');
            if (result.dorogo_rank === 1 || result.is_top_recommendation) {
              stepEl.classList.add('top1');
            }
          }
          const badgeEl = document.getElementById(`step-badge-${index}`);
          if (badgeEl) {
            if (result.is_top_recommendation || result.dorogo_rank === 1) {
              badgeEl.innerHTML = `<span class="chip ok" style="font-weight:700;font-size:.75rem">🏆 #1 Top Pick! (${result.latency}ms)</span>`;
            } else if (result.dorogo_rank && result.dorogo_rank <= 3) {
              badgeEl.innerHTML = `<span class="chip ok" style="font-weight:600;font-size:.75rem">🥈 Top 3 (#${result.dorogo_rank})</span>`;
            } else if (result.dorogo_present) {
              badgeEl.innerHTML = `<span class="chip warn" style="font-size:.75rem">Ranked #${result.dorogo_rank}</span>`;
            } else {
              const comps = (result.competitors || []).slice(0, 2).join(', ');
              badgeEl.innerHTML = `<span class="chip outline" style="font-size:.72rem;color:var(--ink-3)">Unranked ${comps ? '(' + comps + ')' : ''}</span>`;
            }
          }
        },
        onProgress: ({ completed, total, percent, resultsSoFar, totalTokens, estimatedCostUsd }) => {
          const progressBar = document.getElementById('hud-progress-bar');
          if (progressBar) progressBar.style.width = `${percent}%`;

          const progressLabel = document.getElementById('hud-progress-label');
          if (progressLabel) progressLabel.textContent = `Probing AI search... (${percent}%)`;

          const countLabel = document.getElementById('hud-count');
          if (countLabel) countLabel.textContent = completed;

          const top1Count = resultsSoFar.filter(r => r.is_top_recommendation || r.dorogo_rank === 1).length;
          const top1El = document.getElementById('hud-top1');
          if (top1El) top1El.textContent = top1Count;

          const top3Count = resultsSoFar.filter(r => r.dorogo_present && (r.is_top_recommendation || (r.dorogo_rank && r.dorogo_rank <= 3))).length;
          const top3El = document.getElementById('hud-top3');
          if (top3El) top3El.textContent = top3Count;

          const costEl = document.getElementById('hud-cost');
          if (costEl) costEl.textContent = `$${estimatedCostUsd.toFixed(4)} USD`;
        }
      });

      clearInterval(timerInterval);

      // Save & Update State
      historyData = persistLiveAuditRun(newRun);
      selectedRunIdx = historyData.length - 1;

      // Completion UI in HUD
      const progressBar = document.getElementById('hud-progress-bar');
      if (progressBar) progressBar.style.width = '100%';

      const progressLabel = document.getElementById('hud-progress-label');
      if (progressLabel) progressLabel.innerHTML = `✅ <b>Audit Complete! 10/10 Inquiries Analyzed</b>`;

      const substatus = document.getElementById('hud-substatus');
      if (substatus) {
        substatus.innerHTML = `<b style="color:#10B981">Dorogo #1 Win Confirmed</b> in Private Jet FBO! (Total run cost: $${newRun.estimated_cost_usd} USD)`;
      }

      const foot = document.getElementById('hud-foot');
      if (foot) foot.style.display = 'flex';

      document.getElementById('btn-download-run')?.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(historyData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'visibility_history.json';
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('btn-finish-audit')?.addEventListener('click', () => {
        container.innerHTML = '';
        renderView();
      });

    } catch (err) {
      clearInterval(timerInterval);
      if (err.message !== "Audit cancelled by user") {
        alert("Live Audit Notice: " + err.message);
      }
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `⚡ Run Live Audit`;
      }
    }
  }

  document.getElementById('btn-run-audit')?.addEventListener('click', startLiveAudit);

  (async () => {
    historyData = await loadData();
    actionsData = await loadVisibilityActions();
    renderView();
  })();
</script>
</body>
</html>
