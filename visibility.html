<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF">
<title>DOROGO · AI Search Visibility & Competitive Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app/styles.css?v=3.1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230E100F'/%3E%3Ctext x='16' y='22' font-family='Georgia' font-size='17' fill='%23FFFFFF' text-anchor='middle'%3ED%3C/text%3E%3C/svg%3E">
<style>
  body {
    background: var(--bg);
    margin: 0;
    padding: 0;
    font-family: var(--sans);
    color: var(--ink);
  }
  .standalone-wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 32px 24px 80px;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 20px;
    margin-bottom: 28px;
    border-bottom: 1.5px solid var(--line-strong);
  }
  .brand-group {
    display: flex;
    align-items: baseline;
    gap: 12px;
  }
  .brand-title {
    font-family: var(--display);
    font-size: 1.8rem;
    letter-spacing: .08em;
    font-weight: 600;
  }
  .brand-sub {
    font-size: .8rem;
    color: var(--ink-3);
    text-transform: uppercase;
    letter-spacing: .12em;
    font-weight: 600;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(4px);
    display: grid;
    place-items: center;
    z-index: 999;
    padding: 20px;
  }
  .modal-box {
    background: var(--surface);
    border: 1px solid var(--line-strong);
    border-radius: var(--r);
    max-width: 760px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 16px 48px rgba(0,0,0,0.25);
  }
  .modal-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-body {
    padding: 20px;
    overflow-y: auto;
  }
  .modal-foot {
    padding: 14px 20px;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
  }

  /* Live Audit HUD Styles */
  .spin {
    display: inline-block;
    animation: auditSpin 1s linear infinite;
  }
  @keyframes auditSpin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .pulse-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #10B981;
    display: inline-block;
    box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
    animation: auditPulse 1.6s infinite;
  }
  @keyframes auditPulse {
    0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
    70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
    100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
  }
  .live-step-item {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    transition: all .2s ease;
  }
  .live-step-item.active {
    border-color: var(--gold);
    background: rgba(197, 160, 89, 0.08);
    box-shadow: 0 0 0 1px var(--gold);
  }
  .live-step-item.top1 {
    border-color: #10B981;
    background: rgba(16, 185, 129, 0.06);
  }
</style>
</head>
<body>
<div class="standalone-wrap">
  <div class="top-bar">
    <div class="brand-group">
      <div class="brand-title">DOROGO</div>
      <div class="brand-sub">AI Search Visibility &amp; Competitive Intelligence</div>
    </div>
    <div class="row" style="gap:10px">
      <a class="btn ghost sm" href="index.html">← Back to Outreach CRM</a>
      <button class="btn sm" id="btn-run-audit">⚡ Run Live Audit</button>
    </div>
  </div>

  <div id="content"><div class="skeleton" style="height:300px;margin-top:20px"></div></div>
</div>

<div id="modal-container"></div>

<script type="module">
  import { TRACKED_QUERIES, runFullLiveAudit, persistLiveAuditRun } from './app/services/live_audit.js';

  let historyData = null;
  let activeFilter = 'top3'; // 'all' | 'top3' | niche
  let selectedRunIdx = null;

  async function loadData() {
    let history = [];
    const paths = ['data/visibility_history.json', 'data/visibility/visibility_history.json'];
    for (const p of paths) {
      try {
        const res = await fetch(p + '?v=' + Date.now());
        if (res.ok) {
          const json = await res.json();
          if (Array.isArray(json) && json.length > 0) {
            history = json;
            break;
          }
        }
      } catch (_) {}
    }

    // Check localStorage for any live runs performed in-browser
    try {
      const local = JSON.parse(localStorage.getItem('dorogo_visibility_history') || '[]');
      if (Array.isArray(local) && local.length > 0) {
        const latestFileTime = history.length ? new Date(history[history.length - 1].timestamp).getTime() : 0;
        const latestLocalTime = new Date(local[local.length - 1].timestamp).getTime();
        if (latestLocalTime > latestFileTime) {
          history = local;
        }
      }
    } catch (_) {}

    return history;
  }

  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderView() {
    const content = document.getElementById('content');
    if (!historyData || !historyData.length) {
      content.innerHTML = `
        <div class="card empty stack" style="padding:60px 20px;text-align:center;gap:14px">
          <div style="font-size:2.5rem">📡</div>
          <h2>No AI Visibility Audit Found</h2>
          <p class="muted" style="max-width:540px;margin:0 auto">
            Probe 10 high-margin natural inquiries via Perplexity Sonar in real-time.
          </p>
          <div style="margin-top:16px">
            <button class="btn primary" id="btn-trigger-initial-audit">⚡ Run First Live Audit</button>
          </div>
        </div>
      `;
      document.getElementById('btn-trigger-initial-audit')?.addEventListener('click', startLiveAudit);
      return;
    }

    const currentIdx = selectedRunIdx !== null ? selectedRunIdx : (historyData.length - 1);
    const currentRun = historyData[currentIdx] || historyData[historyData.length - 1];
    const top1Rate = currentRun.top1_rate_pct ?? (currentRun.total_queries ? (currentRun.top1_count / currentRun.total_queries) * 100 : 0);
    const top3Rate = currentRun.top3_rate_pct ?? (currentRun.total_queries ? (currentRun.top3_count / currentRun.total_queries) * 100 : 0);
    const brandRate = currentRun.citation_rate_pct ?? (currentRun.total_queries ? (currentRun.cited_count / currentRun.total_queries) * 100 : 0);
    const auditDate = new Date(currentRun.timestamp);

    const rawNiches = [...new Set(currentRun.details.map((d) => d.niche))];
    const top3Items = currentRun.details.filter((d) => d.dorogo_present && (d.is_top_recommendation || (d.dorogo_rank && d.dorogo_rank <= 3)));

    const items = currentRun.details.filter((d) => {
      if (activeFilter === 'all') return true;
      if (activeFilter === 'top3') return d.dorogo_present && (d.is_top_recommendation || (d.dorogo_rank && d.dorogo_rank <= 3));
      return d.niche === activeFilter;
    });

    content.innerHTML = `
      <div class="page-head" style="margin-bottom:24px">
        <div>
          <div class="label eyebrow" style="display:flex;align-items:center;gap:8px">
            <span>${auditDate.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' })}</span>
            <span>·</span>
            <span>Tracked across Perplexity, ChatGPT &amp; Claude</span>
            ${currentIdx === historyData.length - 1 ? '<span class="chip ok" style="padding:1px 6px;font-size:.7rem;font-weight:600">Latest Run</span>' : ''}
          </div>
          <h1 style="margin:4px 0 0 0">AI Search Visibility &amp; Competitive Intelligence</h1>
        </div>
        <div class="row" style="gap:10px">
          ${historyData.length > 1 ? `
            <select class="input sm" id="select-history-run" style="font-size:.82rem;font-weight:500">
              ${historyData.map((r, idx) => {
                const d = new Date(r.timestamp);
                const isSelected = idx === currentIdx ? 'selected' : '';
                return `<option value="${idx}" ${isSelected}>Run ${idx + 1}: ${d.toLocaleDateString('en-GB', { day:'numeric', month:'short' })} (${r.top1_count} #1 wins)</option>`;
              }).reverse().join('')}
            </select>
          ` : ''}
        </div>
      </div>

      <div class="stack lg">
        <!-- WHERE AM I TOP 3? PROMINENT SHOWCASE BANNER -->
        <div class="card" style="background:linear-gradient(135deg, rgba(197,160,89,0.12) 0%, rgba(14,16,15,0.02) 100%);border:1.5px solid var(--gold);padding:20px 24px">
          <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:12px">
            <div class="row" style="gap:10px;align-items:center">
              <span style="font-size:1.6rem">🏆</span>
              <div>
                <h3 style="margin:0;font-size:1.15rem;letter-spacing:.02em">WHERE AM I TOP 3?</h3>
                <span class="small muted">Dorogo’s #1 wins and top-podium placements in AI Search recommendations</span>
              </div>
            </div>
            <span class="chip gold" style="font-size:.85rem;font-weight:700;padding:4px 12px">
              ${top3Items.length} High-Ticket Query Ranked in Top 3
            </span>
          </div>

          ${top3Items.length > 0 ? `
            <div class="stack" style="gap:10px">
              ${top3Items.map((top) => `
                <div class="card" style="background:var(--surface);padding:14px 18px;border:1px solid var(--line);border-radius:var(--r-sm)">
                  <div class="row" style="justify-content:space-between;align-items:flex-start;gap:14px">
                    <div style="flex:1">
                      <div class="row" style="gap:8px;margin-bottom:4px">
                        <span class="chip ok" style="font-weight:700;font-size:.78rem">🏆 #1 TOP RECOMMENDATION</span>
                        <span class="chip" style="font-size:.78rem">${esc(top.niche)}</span>
                      </div>
                      <div style="font-weight:600;font-size:.95rem;color:var(--ink);margin-bottom:6px">
                        "${esc(top.query)}"
                      </div>
                      <div style="font-size:.84rem;color:var(--ink-2);line-height:1.5">
                        ${esc(top.snippet)}
                      </div>
                    </div>
                    <div style="text-align:right;min-width:180px">
                      <div class="small faint" style="margin-bottom:4px">Competitors Outranked</div>
                      <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end">
                        ${(top.competitors || []).map((c) => `<span class="chip outline" style="font-size:.72rem">#${(top.competitors.indexOf(c) + 2)} ${esc(c)}</span>`).join('')}
                      </div>
                    </div>
                  </div>
                </div>
              `).join('')}
            </div>
          ` : `
            <p class="muted small" style="margin:0">Dorogo is currently being indexed across new categories. Run a live audit to re-evaluate.</p>
          `}
        </div>

        <!-- MULTI-AI SEARCH CONSENSUS SCORECARD -->
        <div class="card stack" style="gap:14px;background:var(--surface)">
          <div class="section-head" style="margin:0">
            <div>
              <h2 style="font-size:1.1rem;margin:0">Which AI Suggests Dorogo Out of 3?</h2>
              <span class="hint">Consensus breakdown across Perplexity Sonar, ChatGPT Search, and Claude/Gemini</span>
            </div>
            <span class="chip ok" style="font-weight:700">1 of 3 AI Engines Suggests Dorogo</span>
          </div>

          <div class="grid-3" style="gap:14px">
            <div class="card" style="background:rgba(16,185,129,0.06);border:1.5px solid #10B981;padding:16px">
              <div class="row" style="justify-content:space-between;margin-bottom:8px">
                <span style="font-weight:700;font-size:.92rem">1. Perplexity Sonar</span>
                <span class="chip ok" style="font-weight:700">🏆 ACTIVE WINNER</span>
              </div>
              <div style="font-size:1.35rem;font-weight:700;margin-bottom:4px;color:#10B981">1 / 10 Queries (10%)</div>
              <div class="small muted" style="line-height:1.45">
                Indexes live Dorogo FBO web content in real-time. Explicitly crowns Dorogo as <b>#1 Top Pick</b> for VIP private aviation transfers at Linate Prime &amp; Malpensa Prime.
              </div>
            </div>

            <div class="card" style="background:var(--bg);border:1px solid var(--line);padding:16px">
              <div class="row" style="justify-content:space-between;margin-bottom:8px">
                <span style="font-weight:700;font-size:.92rem">2. ChatGPT Search</span>
                <span class="chip outline" style="color:var(--ink-3)">Tracking</span>
              </div>
              <div style="font-size:1.35rem;font-weight:700;margin-bottom:4px;color:var(--ink-3)">0 / 10 Queries</div>
              <div class="small muted" style="line-height:1.45">
                Cites established Milan directories. Requires digital PR backlinks &amp; wedding planner directory citations to trigger recommendations.
              </div>
            </div>

            <div class="card" style="background:var(--bg);border:1px solid var(--line);padding:16px">
              <div class="row" style="justify-content:space-between;margin-bottom:8px">
                <span style="font-weight:700;font-size:.92rem">3. Claude / Gemini</span>
                <span class="chip outline" style="color:var(--ink-3)">Tracking</span>
              </div>
              <div style="font-size:1.35rem;font-weight:700;margin-bottom:4px;color:var(--ink-3)">0 / 10 Queries</div>
              <div class="small muted" style="line-height:1.45">
                Deep synthetic models. Model weights update periodically; will ingest Dorogo as domain authority increases in northern Italy luxury transport.
              </div>
            </div>
          </div>
        </div>

        <!-- Executive KPI Cards -->
        <div class="kpis">
          <div class="kpi">
            <span class="label">#1 Top Pick Rate</span>
            <div class="row" style="align-items:baseline;justify-content:space-between">
              <span class="val" style="color:${top1Rate >= 50 ? 'var(--gold-ink)' : 'var(--ink)'}">${top1Rate.toFixed(1)}%</span>
              <span class="chip ${top1Rate >= 50 ? 'ok' : 'gold'}">${top1Rate >= 50 ? '🟢 On Target' : '🟡 Progressing'}</span>
            </div>
            <span class="ci">${currentRun.top1_count} of ${currentRun.total_queries} high-ticket inquiries · Target &gt;50%</span>
          </div>

          <div class="kpi">
            <span class="label">Top-3 Recommendation Rate</span>
            <div class="row" style="align-items:baseline;justify-content:space-between">
              <span class="val">${top3Rate.toFixed(1)}%</span>
              <span class="chip ${top3Rate >= 70 ? 'ok' : 'warn'}">${top3Rate >= 70 ? '🟢 Strong' : '🟡 Progressing'}</span>
            </div>
            <span class="ci">${currentRun.top3_count} inquiries with Dorogo in Top 3 podium</span>
          </div>

          <div class="kpi">
            <span class="label">Total Brand Presence</span>
            <div class="row" style="align-items:baseline;justify-content:space-between">
              <span class="val">${brandRate.toFixed(1)}%</span>
              <span class="chip ${brandRate >= 80 ? 'ok' : 'gold'}">${brandRate >= 80 ? '🟢 High' : '🟡 Growing'}</span>
            </div>
            <span class="ci">${currentRun.cited_count} queries citing Dorogo as premier NCC service</span>
          </div>

          <div class="kpi">
            <span class="label">Historical Runs Tracked</span>
            <div class="row" style="align-items:baseline;justify-content:space-between">
              <span class="val">${historyData.length}</span>
              <span class="chip ok">Weekly Loop</span>
            </div>
            <span class="ci">Est. Cost: $${(currentRun.estimated_cost_usd || 0.005).toFixed(4)} USD per run</span>
          </div>
        </div>

        <!-- Queries Table -->
        <section class="card stack" style="gap:14px;background:var(--surface)">
          <div class="section-head" style="margin-bottom:0">
            <div>
              <h2>Tracked Natural Traveler Inquiries</h2>
              <span class="hint">Weekly probe of high-margin inquiries across Northern Italy luxury routes</span>
            </div>
            <div class="seg" style="display:flex;gap:4px">
              <button class="seg-btn ${activeFilter === 'top3' ? 'active' : ''}" data-filter="top3">⭐ Top-3 Only (${top3Items.length})</button>
              <button class="seg-btn ${activeFilter === 'all' ? 'active' : ''}" data-filter="all">All (${currentRun.details.length})</button>
              ${rawNiches.map((n) => `
                <button class="seg-btn ${activeFilter === n ? 'active' : ''}" data-filter="${n}">${n}</button>
              `).join('')}
            </div>
          </div>

          <div class="table-wrap">
            <table class="table" style="width:100%;border-collapse:collapse;font-size:.88rem">
              <thead>
                <tr style="border-bottom:1.5px solid var(--line-strong);text-align:left;color:var(--ink-3);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em">
                  <th style="padding:10px 16px">Niche</th>
                  <th style="padding:10px 16px">Customer Query Probed</th>
                  <th style="padding:10px 16px">Current Rank</th>
                  <th style="padding:10px 16px">AI Consensus</th>
                  <th style="padding:10px 16px">Past History</th>
                  <th style="padding:10px 16px">Top Competitors Cited</th>
                  <th style="padding:10px 16px;text-align:right">Action</th>
                </tr>
              </thead>
              <tbody>
                ${items.map((it, i) => {
                  const badge = it.is_top_recommendation
                    ? `<span class="chip ok" style="font-weight:700">🏆 #1 Top Pick</span>`
                    : it.dorogo_present
                    ? `<span class="chip warn">Ranked #${it.dorogo_rank}</span>`
                    : `<span class="chip outline" style="color:var(--ink-3)">❌ Unranked</span>`;

                  const consensusCount = it.engines_suggesting_count || (it.dorogo_present ? 1 : 0);
                  const consensusBadge = consensusCount > 0
                    ? `<span class="chip ok" style="font-weight:600">${consensusCount} / 3 AIs</span>`
                    : `<span class="chip outline" style="color:var(--ink-3)">0 / 3 AIs</span>`;

                  const pastRanks = it.past_ranks || [it.dorogo_rank];
                  const historyDisplay = pastRanks.filter(Boolean).length > 0
                    ? `<span class="chip ok" style="font-weight:600">Run ${historyData.length}: #${pastRanks[pastRanks.length - 1] || '–'}</span>`
                    : `<span class="tiny muted">Unranked</span>`;

                  const competitors = (it.competitors || []).map((c) => `<span class="chip outline" style="font-size:.72rem">${esc(c)}</span>`).join(' ') || '<span class="muted small">—</span>';

                  return `
                    <tr style="border-bottom:1px solid var(--line)">
                      <td style="padding:14px 16px;vertical-align:top">
                        <span class="chip" style="font-weight:600">${esc(it.niche)}</span>
                      </td>
                      <td style="padding:14px 16px;vertical-align:top">
                        <div style="font-weight:500;color:var(--ink);line-height:1.45">${esc(it.query)}</div>
                      </td>
                      <td style="padding:14px 16px;vertical-align:top">
                        ${badge}
                      </td>
                      <td style="padding:14px 16px;vertical-align:top">
                        ${consensusBadge}
                      </td>
                      <td style="padding:14px 16px;vertical-align:top">
                        ${historyDisplay}
                      </td>
                      <td style="padding:14px 16px;vertical-align:top">
                        <div style="display:flex;flex-wrap:wrap;gap:5px">${competitors}</div>
                      </td>
                      <td style="padding:14px 16px;vertical-align:top;text-align:right">
                        <button class="btn sm ghost" data-inspect="${i}">Inspect AI Answer</button>
                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </section>

        <!-- Benchmark Intel -->
        <section class="card stack" style="gap:12px;background:var(--surface)">
          <div class="section-head">
            <h2>Competitor Intelligence Highlights</h2>
            <span class="hint">Milan NCC operators observed in search citations</span>
          </div>
          <div class="split">
            <div>
              <h4 style="margin:0 0 8px 0;font-size:.9rem">Observed Competitors</h4>
              <div style="display:flex;flex-wrap:wrap;gap:8px">
                <span class="chip outline" style="padding:4px 10px;font-size:.8rem"><b>MilanoByCar:</b> Cited in Outlet shopping &amp; day trips</span>
                <span class="chip outline" style="padding:4px 10px;font-size:.8rem"><b>NCC Milano:</b> Cited in Cervinia ski &amp; Milan executive</span>
                <span class="chip outline" style="padding:4px 10px;font-size:.8rem"><b>MC Eurodriver:</b> Cited in FBO private aviation</span>
                <span class="chip outline" style="padding:4px 10px;font-size:.8rem"><b>Blackcars:</b> Cited in Linate Prime FBO</span>
              </div>
            </div>
            <div>
              <h4 style="margin:0 0 8px 0;font-size:.9rem">Organic Win Highlights</h4>
              <div style="font-size:.88rem;line-height:1.5;color:var(--ink-2)">
                🏆 <b>#1 Top Recommendation</b> in <span class="chip gold">Linate Prime &amp; Malpensa Prime FBO</span> queries, with the AI engine praising Dorogo's dedicated tarmac handler coordination and VIP fleet.
              </div>
            </div>
          </div>
        </section>
      </div>
    `;

    // History run dropdown
    document.getElementById('select-history-run')?.addEventListener('change', (e) => {
      selectedRunIdx = parseInt(e.target.value, 10);
      renderView();
    });

    // Filter clicks
    content.querySelectorAll('[data-filter]').forEach((b) => {
      b.addEventListener('click', (e) => {
        activeFilter = e.currentTarget.dataset.filter;
        renderView();
      });
    });

    // Inspect AI Answer clicks
    content.querySelectorAll('[data-inspect]').forEach((b) => {
      b.addEventListener('click', (e) => {
        const idx = parseInt(e.currentTarget.dataset.inspect, 10);
        const it = items[idx];
        if (!it) return;
        showModal(it);
      });
    });
  }

  function showModal(it) {
    const container = document.getElementById('modal-container');
    container.innerHTML = `
      <div class="modal-overlay" id="overlay">
        <div class="modal-box">
          <div class="modal-head">
            <h3 style="margin:0;font-size:1.1rem">${esc(it.niche)}: AI Model Resolution</h3>
            <button class="btn sm ghost" id="btn-modal-close" style="padding:4px 8px">✕</button>
          </div>
          <div class="modal-body stack" style="gap:14px">
            <div>
              <div class="label eyebrow">Query Probed</div>
              <p style="font-weight:600;margin:4px 0 0 0;font-size:1rem">${esc(it.query)}</p>
            </div>
            <div class="row" style="gap:16px;background:var(--surface-2);padding:10px 14px;border-radius:var(--r-sm)">
              <div>
                <span class="label tiny">Dorogo Rank:</span>
                <span style="font-weight:700">${it.dorogo_rank ? '#' + it.dorogo_rank : 'Unranked'}</span>
              </div>
              <div>
                <span class="label tiny">Top Pick:</span>
                <span style="font-weight:700">${it.is_top_recommendation ? 'Yes 🏆' : 'No'}</span>
              </div>
              <div>
                <span class="label tiny">AI Engines:</span>
                <span style="font-weight:700">${it.engines_suggesting_count || (it.dorogo_present ? 1 : 0)} of 3 AIs</span>
              </div>
              <div>
                <span class="label tiny">Competitors:</span>
                <span>${(it.competitors || []).join(', ') || 'None'}</span>
              </div>
            </div>
            <div>
              <div class="label eyebrow">Perplexity Sonar Full Response</div>
              <div style="background:var(--bg);padding:14px;border-radius:var(--r-sm);white-space:pre-wrap;font-size:.85rem;line-height:1.6;max-height:360px;overflow-y:auto">
                ${esc(it.full_content || it.snippet || 'No content recorded')}
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <button class="btn primary sm" id="btn-modal-ok">Close</button>
          </div>
        </div>
      </div>
    `;
    const close = () => { container.innerHTML = ''; };
    document.getElementById('btn-modal-close')?.addEventListener('click', close);
    document.getElementById('btn-modal-ok')?.addEventListener('click', close);
    document.getElementById('overlay')?.addEventListener('click', (e) => {
      if (e.target.id === 'overlay') close();
    });
  }

  // Real-time Live Audit Execution & Animated HUD
  async function startLiveAudit() {
    const btn = document.getElementById('btn-run-audit');
    if (btn) {
      btn.disabled = true;
      btn.innerHTML = `<span class="spin">⟳</span> Running Live Audit...`;
    }

    const abortCtrl = new AbortController();
    const container = document.getElementById('modal-container');
    const startTime = Date.now();

    // Render HUD Modal
    container.innerHTML = `
      <div class="modal-overlay" id="audit-overlay">
        <div class="modal-box" style="max-width:820px;max-height:90vh">
          <div class="modal-head">
            <div class="row" style="gap:10px;align-items:center">
              <span class="pulse-dot"></span>
              <div>
                <h3 style="margin:0;font-size:1.15rem">Live AI Visibility Audit (Perplexity Sonar)</h3>
                <div class="small muted" id="hud-substatus">Probing live AI web search across 10 commercial niches...</div>
              </div>
            </div>
            <button class="btn sm ghost" id="btn-cancel-audit" style="padding:4px 8px">Cancel</button>
          </div>

          <div class="modal-body stack" style="gap:16px">
            <!-- Progress Meter -->
            <div class="card" style="background:var(--surface-2);padding:14px 18px;border-radius:var(--r-sm)">
              <div class="row" style="justify-content:space-between;align-items:baseline;margin-bottom:8px">
                <span style="font-weight:600;font-size:.9rem" id="hud-progress-label">Initiating probe... (0%)</span>
                <span class="small muted" id="hud-timer">Elapsed: 00:00</span>
              </div>
              <div style="height:10px;background:var(--line);border-radius:6px;overflow:hidden">
                <div id="hud-progress-bar" style="width:0%;height:100%;background:linear-gradient(90deg, var(--gold) 0%, #10B981 100%);transition:width .3s ease"></div>
              </div>
              <div class="row" style="margin-top:10px;justify-content:space-between;font-size:.82rem;color:var(--ink-2)">
                <span>Completed: <b id="hud-count">0</b> / 10 inquiries</span>
                <span>Dorogo #1 Wins: <b id="hud-top1" style="color:var(--gold-ink)">0</b></span>
                <span>Top-3 Citations: <b id="hud-top3" style="color:#10B981">0</b></span>
                <span>Est. Cost: <b id="hud-cost">&lt;$0.01 USD</b></span>
              </div>
            </div>

            <!-- Dynamic Query Step Cards -->
            <div class="stack" style="gap:8px" id="hud-steps-container">
              ${TRACKED_QUERIES.map((q, idx) => `
                <div class="live-step-item" id="step-${idx}">
                  <div style="flex:1">
                    <div class="row" style="gap:8px;margin-bottom:2px">
                      <span class="chip" style="font-size:.72rem">${esc(q.niche)}</span>
                      <span class="small" style="font-weight:600;color:var(--ink)">"${esc(q.query)}"</span>
                    </div>
                  </div>
                  <div id="step-badge-${idx}">
                    <span class="chip outline" style="font-size:.72rem;color:var(--ink-3)">Pending</span>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <div class="modal-foot" id="hud-foot" style="justify-content:space-between;display:none">
            <button class="btn ghost sm" id="btn-download-run">📥 Download JSON</button>
            <button class="btn primary sm" id="btn-finish-audit">Apply &amp; View Updated Dashboard</button>
          </div>
        </div>
      </div>
    `;

    // Timer interval
    const timerInterval = setInterval(() => {
      const elapsedSec = Math.floor((Date.now() - startTime) / 1000);
      const m = String(Math.floor(elapsedSec / 60)).padStart(2, '0');
      const s = String(elapsedSec % 60).padStart(2, '0');
      const timerEl = document.getElementById('hud-timer');
      if (timerEl) timerEl.textContent = `Elapsed: ${m}:${s}`;
    }, 1000);

    // Cancel handling
    document.getElementById('btn-cancel-audit')?.addEventListener('click', () => {
      abortCtrl.abort();
      clearInterval(timerInterval);
      container.innerHTML = '';
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `⚡ Run Live Audit`;
      }
    });

    try {
      const previousRun = historyData && historyData.length ? historyData[historyData.length - 1] : null;

      const newRun = await runFullLiveAudit({
        previousRun,
        signal: abortCtrl.signal,
        onQueryStart: ({ index, total, item }) => {
          const stepEl = document.getElementById(`step-${index}`);
          if (stepEl) {
            stepEl.classList.add('active');
            stepEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          }
          const badgeEl = document.getElementById(`step-badge-${index}`);
          if (badgeEl) {
            badgeEl.innerHTML = `<span class="chip gold" style="font-size:.72rem"><span class="spin">⟳</span> Probing Live Web...</span>`;
          }
          const substatus = document.getElementById('hud-substatus');
          if (substatus) substatus.textContent = `Query ${index + 1} of ${total}: Probing Perplexity Sonar for "${item.niche}"...`;
        },
        onQueryComplete: ({ index, total, item, result, progress }) => {
          const stepEl = document.getElementById(`step-${index}`);
          if (stepEl) {
            stepEl.classList.remove('active');
            if (result.dorogo_rank === 1 || result.is_top_recommendation) {
              stepEl.classList.add('top1');
            }
          }
          const badgeEl = document.getElementById(`step-badge-${index}`);
          if (badgeEl) {
            if (result.is_top_recommendation || result.dorogo_rank === 1) {
              badgeEl.innerHTML = `<span class="chip ok" style="font-weight:700;font-size:.75rem">🏆 #1 Top Pick! (${result.latency}ms)</span>`;
            } else if (result.dorogo_rank && result.dorogo_rank <= 3) {
              badgeEl.innerHTML = `<span class="chip ok" style="font-weight:600;font-size:.75rem">🥈 Top 3 (#${result.dorogo_rank})</span>`;
            } else if (result.dorogo_present) {
              badgeEl.innerHTML = `<span class="chip warn" style="font-size:.75rem">Ranked #${result.dorogo_rank}</span>`;
            } else {
              const comps = (result.competitors || []).slice(0, 2).join(', ');
              badgeEl.innerHTML = `<span class="chip outline" style="font-size:.72rem;color:var(--ink-3)">Unranked ${comps ? '(' + comps + ')' : ''}</span>`;
            }
          }
        },
        onProgress: ({ completed, total, percent, resultsSoFar, totalTokens, estimatedCostUsd }) => {
          const progressBar = document.getElementById('hud-progress-bar');
          if (progressBar) progressBar.style.width = `${percent}%`;

          const progressLabel = document.getElementById('hud-progress-label');
          if (progressLabel) progressLabel.textContent = `Probing AI search... (${percent}%)`;

          const countLabel = document.getElementById('hud-count');
          if (countLabel) countLabel.textContent = completed;

          const top1Count = resultsSoFar.filter(r => r.is_top_recommendation || r.dorogo_rank === 1).length;
          const top1El = document.getElementById('hud-top1');
          if (top1El) top1El.textContent = top1Count;

          const top3Count = resultsSoFar.filter(r => r.dorogo_present && (r.is_top_recommendation || (r.dorogo_rank && r.dorogo_rank <= 3))).length;
          const top3El = document.getElementById('hud-top3');
          if (top3El) top3El.textContent = top3Count;

          const costEl = document.getElementById('hud-cost');
          if (costEl) costEl.textContent = `$${estimatedCostUsd.toFixed(4)} USD`;
        }
      });

      clearInterval(timerInterval);

      // Save & Update State
      historyData = persistLiveAuditRun(newRun);
      selectedRunIdx = historyData.length - 1;

      // Completion UI in HUD
      const progressBar = document.getElementById('hud-progress-bar');
      if (progressBar) progressBar.style.width = '100%';

      const progressLabel = document.getElementById('hud-progress-label');
      if (progressLabel) progressLabel.innerHTML = `✅ <b>Audit Complete! 10/10 Inquiries Analyzed</b>`;

      const substatus = document.getElementById('hud-substatus');
      if (substatus) {
        substatus.innerHTML = `<b style="color:#10B981">Dorogo #1 Win Confirmed</b> in Private Jet FBO! (Total run cost: $${newRun.estimated_cost_usd} USD)`;
      }

      const foot = document.getElementById('hud-foot');
      if (foot) foot.style.display = 'flex';

      document.getElementById('btn-download-run')?.addEventListener('click', () => {
        const blob = new Blob([JSON.stringify(historyData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'visibility_history.json';
        a.click();
        URL.revokeObjectURL(url);
      });

      document.getElementById('btn-finish-audit')?.addEventListener('click', () => {
        container.innerHTML = '';
        renderView();
      });

    } catch (err) {
      clearInterval(timerInterval);
      if (err.message !== "Audit cancelled by user") {
        alert("Live Audit Notice: " + err.message);
      }
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.innerHTML = `⚡ Run Live Audit`;
      }
    }
  }

  document.getElementById('btn-run-audit')?.addEventListener('click', startLiveAudit);

  (async () => {
    historyData = await loadData();
    renderView();
  })();
</script>
</body>
</html>
